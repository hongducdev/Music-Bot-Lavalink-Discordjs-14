</style><header><h1>MusicBot · Components V2</h1><p>Bản xem trước bố cục từ payload của các hàm dựng thẻ. Dữ liệu minh họa, ảnh thay thế, nút không tương tác. Đây không phải ảnh chụp Discord; kích thước và cách xuống dòng thực tế do Discord quyết định.</p></header><main id="cards"></main>

7,"accent_color":5793266,"components":[{"type":10,"content":"### Radio 24/7"},{"type":10,"content":"Chọn âm thanh cho buổi học, giờ làm hoặc lúc nghỉ ngơi."},{"type":14,"spacing":1},{"type":10,"content":"### Tập trung & thư giãn\n☕ **Lofi Girl - beats to relax/study** · `lofi`\n🌙 **Lofi Girl - beats to sleep/chill** · `sleep`\n🍃 **Chillhop Radio 24/7** · `chill`"},{"type":14,"spacing":1},{"type":10,"content":"### Phát thanh Việt Nam\n🎙️ **VOV1 - Thời Sự** · `vov1`\n📻 **VOV2 - Văn hoá & Đời sống** · `vov2`\n🎵 **VOV3 - Âm nhạc & Giải trí** · `vov3`\n🏔️ **VOV4 - Dân tộc** · `vov4`\n🌏 **VOV5 - Đối ngoại** · `vov5`\n🏙️ **Hà Nội HTV - FM 96 MHz** · `hanoi`\n🌉 **Đà Nẵng DRT - FM 98.5 MHz** · `danang`\n⛰️ **Quảng Ninh QNR1 - FM 97.8 MHz** · `quangninh`"},{"type":14,"spacing":1},{"type":1,"components":[{"type":3,"custom_id":"radio_select_station","placeholder":"Chọn kênh phát thanh 24/7...","options":[{"emoji":{"name":"☕","animated":false},"label":"Lofi Girl - beats to relax/study","value":"lofi","description":"Lofi hip hop để học bài / thư giãn"},{"emoji":{"name":"🌙","animated":false},"label":"Lofi Girl - beats to sleep/chill","value":"sleep","description":"Nhịp chậm, dễ ngủ / nghỉ ngơi"},{"emoji":{"name":"🍃","animated":false},"label":"Chillhop Radio 24/7","value":"chill","description":"Jazzy & lofi hip hop beats"},{"emoji":{"name":"🎙️","animated":false},"label":"VOV1 - Thời Sự","value":"vov1","description":"Tin tức, thời sự quốc gia 24/7"},{"emoji":{"name":"📻","animated":false},"label":"VOV2 - Văn hoá & Đời sống","value":"vov2","description":"Văn hoá, giải trí và âm nhạc Việt Nam"},{"emoji":{"name":"🎵","animated":false},"label":"VOV3 - Âm nhạc & Giải trí","value":"vov3","description":"Âm nhạc hiện đại và giải trí cho giới trẻ"},{"emoji":{"name":"🏔️","animated":false},"label":"VOV4 - Dân tộc","value":"vov4","description":"Văn hoá các dân tộc Việt Nam"},{"emoji":{"name":"🌏","animated":false},"label":"VOV5 - Đối ngoại","value":"vov5","description":"Phát thanh quốc tế bằng nhi help \u003clệnh>"}]}],"allowedMentions":{"parse":[]},"flags":32832}},{"title":"Thông tin bot","payload":{"components":[{"type":17,"accent_color":5793266,"components":[{"type":9,"components":[{"type":10,"content":"### MusicBot"},{"type":10,"content":"Nhạc cho những lúc ở cùng nhau.\nVào kênh thoại, dùng `/play` để chọn bài hoặc `/radio` để nghe liên tục."},{"type":10,"content":"`/help` · 17 lệnh · prefix `!`"}],"accessory":{"type":11,"media":{"url":"https://example.com/avatar.png"},"description":"Ảnh đại diện của MusicBot"}},{"type":14,"spacing":1},{"type":10,"content":"**Kết nối** 42 ms · hoạt động 1:02:03\n**Cộng đồng** 2 server · 15 thành viên\n**Tác giả** hongduc.dev"},{"type":14,"spacing":1},{"type":1,"components":[{"type":2,"style":5,"label":"Mời bot","url":"https://discord.com/oauth2/authorize?client_id=999&scope=bot+applications.commands&permissions=3165184"}]},{"type":14,"divider":false,"spacing":1},{"type":10,"content":"-# Ví dụ: !play con cá con chim"}]}],"allowedMentions":{"parse":[]},"flags":32832}},{"title":"Thông báo","payload":{"components":[{"type":17,"accent_color":5793266,"components":[{"type":10,"content":"### Tạm dừng"},{"type":10,"content":"⏸️ Đã tạm dừng nhạc. Dùng `/resume` để phát tiếp."}]}],"allowedMentions":{"parse":[]},"flags":32832}},{"title":"Lỗi","payload":{"components":[{"type":17,"accent_color":15548997,"components":[{"type":10,"content":"### Phát nhạc"},{"type":10,"content":"🚫 Bạn cần vào một kênh thoại trước đã!"}]}],"allowedMentions":{"parse":[]},"flags":32832}}];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markdown(s){return escape(s).replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^-# (.+)$/gm,'<span class="small">$1</span>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\[([^\]]+)\]\([^\n]+?\)/g,'<a>$1</a>');}
function render(c){switch(c.type){case 17:return '<div class="card" style="--accent:#'+c.accent_color.toString(16).padStart(6,'0')+'">'+c.components.map(render).join('')+'</div>';case 10:return '<div class="text">'+markdown(c.content)+'</div>';case 9:return '<div class="section"><div>'+c.components.map(render).join('')+'</div><div class="thumb" role="img" aria-label="Ảnh thu nhỏ thay thế">♫</div></div>';case 12:return '<div class="gallery" role="img" aria-label="Vị trí ảnh bìa"><b>♫</b><small>ẢNH BÌA TỪ NGUỒN PHÁT</small></div>';case 14:return c.divider===false?'<div class="space"></div>':'<hr>';case 1:return '<div class="row">'+c.components.map(render).join('')+'</div>';case 2:return '<button disabled class="'+(c.style===1?'primary':c.style===4?'danger':'')+'">'+escape((c.emoji?.name||'')+' '+c.label)+'</button>';case 3:return '<select disabled aria-label="Chọn đài"><option>'+escape(c.placeholder)+'</option>'+c.options.map(o=>'<option>'+escape(o.label)+'</option>').join('')+'</select>';default:return '';}}
document.querySelector('#cards').innerHTML=cards.map(c=>'<article><p class="label">'+escape(c.title)+'</p>'+c.payload.components.map(render).join('')+'<details><summary>Payload Components V2</summary><pre>'+escape(JSON.stringify(c.payload,null,2))+'</pre></details></article>').join('');
</script></html>
