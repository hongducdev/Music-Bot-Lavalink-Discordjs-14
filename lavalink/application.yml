server:
  port: ${LAVALINK_PORT:2333}
  # Chi nghe tren localhost, khong mo ra mang ngoai
  address: 127.0.0.1

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    # Lay tu .env (chay Lavalink bang start.ps1 de nap bien moi truong)
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEBEMBEDDED
      - WEB
      - MUSIC
    oauth:
      enabled: true
      # Lay tu YT_OAUTH_REFRESH_TOKEN trong .env (tai khoan phu!)
      refreshToken: "${YT_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: true
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: true
      jiosaavn: false
    spotify:
      # Lay tu SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET trong .env
      # Tao app mien phi tai https://developer.spotify.com/dashboard
      # Sau khi co, doi sources.spotify thanh true.
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "VN"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
    ytdlp:
      # yt-dlp.exe khong co trong git:
      #   Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile lavalink\yt-dlp.exe
      path: "./yt-dlp.exe"
      searchLimit: 10

logging:
  file:
    path: ./logs
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    # Bat lai 3 dong duoi khi can chan doan loi ket noi voice:
    # lavalink.server.player: DEBUG
    # lavalink.server.io: DEBUG
    # com.sedmelluq.discord.lavaplayer: DEBUG
